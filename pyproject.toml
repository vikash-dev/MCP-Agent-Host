[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-agent-host"
version = "1.0.0"
description = "Modular, Config-Driven Model Context Protocol (MCP) Agent Host with Dynamic Model Switching and Guardrails"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Security AI Engineering Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "jinja2>=3.1.4",
    "rich>=13.7.0",
    "mcp>=1.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
mcp-host = "main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
